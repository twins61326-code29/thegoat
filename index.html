<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="nova-icon-192x192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D1F">
<title>NovaCalc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0A0D1F;--panel:#121737;--key:#1A2050;--key2:#262E6B;--ink:#EEF1FF;--mute:#8E97C9;--nova:#4DE1FF;--plasma:#8B5CFF;--ember:#FF6B8A;--line:#ffffff17;--on:#06081a}
[data-theme=light]{--bg:#EEF1FF;--panel:#fff;--key:#E3E7FB;--key2:#CFD6F4;--ink:#10153A;--mute:#5A6399;--nova:#0A8FB3;--plasma:#6A3FE0;--ember:#D6365A;--line:#10153a1f;--on:#fff}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%}body{overflow-x:hidden}
body{background:radial-gradient(110% 55% at 85% -8%,color-mix(in srgb,var(--plasma) 30%,transparent),transparent 62%),var(--bg);color:var(--ink);font:500 16px/1.4 Sora,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--nova);outline-offset:2px}
.app{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;margin:auto;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
header{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:1.25rem;font-weight:300;direction:ltr;display:flex;align-items:center;gap:8px}
.brand b{font-weight:700;margin-right:-6px}
.brand i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--nova),var(--plasma));box-shadow:0 0 14px var(--nova)}
.tools{display:flex;gap:8px}
#lang,#bTheme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:36px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px}
.tabs button{flex:1;padding:8px;border-radius:12px;color:var(--mute)}
.tabs .on{background:var(--key2);color:var(--ink)}
section{flex:1;display:flex;flex-direction:column;gap:12px}
.screen{flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:4px;padding:6px 4px;overflow:hidden}
.row{display:flex;gap:8px;margin-bottom:auto;width:100%;justify-content:space-between}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem;color:var(--mute)}
.pv{min-height:1.4em;color:var(--mute);font-size:1.05rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex{font-weight:300;line-height:1.1;max-width:100%;overflow-wrap:anywhere;text-align:right;letter-spacing:-.02em}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad button{height:clamp(50px,9vh,68px);border-radius:20px;background:var(--key);font-size:1.5rem;transition:transform .08s,background .15s}
.pad button:active{transform:scale(.94);background:var(--key2)}
.pad .op{background:color-mix(in srgb,var(--plasma) 24%,var(--key));color:var(--nova)}
.pad .fn{color:var(--mute);font-size:1.15rem}
.pad .ac{color:var(--ember)}
.pad .eq{position:relative;border-radius:999px;color:var(--on);background:radial-gradient(circle at 30% 25%,var(--nova),var(--plasma));box-shadow:0 6px 26px color-mix(in srgb,var(--nova) 45%,transparent);font-weight:700}
.eq::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--nova);opacity:0;pointer-events:none}
.eq.burst::after{animation:nova .7s ease-out}
@keyframes nova{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.4,3.2)}}
#conv{justify-content:flex-start}
#cats{display:flex;gap:8px;flex-wrap:wrap}
#cats .on{color:var(--on);background:linear-gradient(135deg,var(--nova),var(--plasma));border-color:transparent}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;gap:10px;align-items:center;direction:ltr}
.box input,.box output{flex:1;min-width:0;font-size:2rem;font-weight:300;background:none;border:0;overflow:hidden;text-overflow:ellipsis;outline-offset:6px}
.box select{background:var(--key);border:0;border-radius:12px;padding:10px}
#sw{align-self:center;width:46px;height:46px;border-radius:50%;background:var(--key2);font-size:1.2rem}
#veil{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#tape{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:auto;max-height:72dvh;background:var(--panel);border:1px solid var(--line);border-radius:26px 26px 0 0;transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
.open #tape{transform:none}.open #veil{opacity:1;pointer-events:auto}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.th span{display:flex;gap:6px}
#hl{list-style:none;padding:0;overflow:auto}
#hl li{border-bottom:1px dashed var(--line)}
#hl li button{width:100%;display:flex;flex-direction:column;align-items:flex-end;padding:10px 4px;direction:ltr}
#hl small{color:var(--mute)}#hl strong{font-size:1.3rem;font-weight:500}
#hl .none{padding:24px;text-align:center;color:var(--mute);border:0}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#conv{width:100%;max-width:520px;margin:0 auto}
@media(min-width:760px){
.app{max-width:940px;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.tabs{max-width:420px;align-self:center;width:100%}
#calc{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);grid-template-rows:1fr auto;gap:12px 28px}
.screen{grid-column:1;grid-row:1}.pad{grid-column:1;grid-row:2}
.pad button{height:clamp(54px,8.5vh,72px)}
#tape{grid-column:2;grid-row:1/3;align-self:start;max-height:min(640px,calc(100vh - 190px));position:static;transform:none;max-width:none;margin:0;border-radius:24px;padding:18px;z-index:auto;transition:none}
#hl{min-height:0}
#veil,#bTape,#bX{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header>
 <h1 class="brand"><i></i><b>Nova</b>Calc</h1>
 <div class="tools">
  <select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select>
  <button id="bTheme" aria-label="Theme">◐</button>
 </div>
</header>
<nav class="tabs"><button class="on" data-tab="calc" data-i="calc"></button><button data-tab="conv" data-i="conv"></button></nav>

<section id="calc">
 <div class="screen" dir="ltr">
  <div class="row"><button id="bTape" class="chip" data-i="hist"></button><button id="bCopy" class="chip" data-i="copy"></button></div>
  <div id="pv" class="pv" aria-live="polite"></div>
  <div id="ex" class="ex">0</div>
 </div>
 <div class="pad" dir="ltr">
  <button class="fn ac" data-k="AC">AC</button><button class="fn" data-k="⌫" aria-label="Backspace">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="÷">÷</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
  <button class="fn" data-k="P">( )</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
 </div>
<aside id="tape" inert aria-label="History">
 <div class="th"><b data-i="hist"></b><span><button id="bClr" class="chip" data-i="clear"></button><button id="bX" class="chip" data-i="close"></button></span></div>
 <ul id="hl"></ul>
</aside>
</section>

<section id="conv" hidden>
 <div id="cats"></div>
 <div class="box"><input id="cv" type="text" inputmode="decimal" value="1" aria-label="Value"><select id="cf" aria-label="From"></select></div>
 <button id="sw" aria-label="Swap">⇅</button>
 <div class="box"><output id="co">1</output><select id="ct" aria-label="To"></select></div>
</section>
</main>

<div id="veil"></div>
<div id="toast" role="status"></div>

<script>
(()=>{
addEventListener("error",e=>{const t=document.getElementById("toast");if(t){t.textContent="⚠ "+e.message;t.classList.add("show")}});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ls={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const T={
ar:{calc:"حاسبة",conv:"محوّل",hist:"السجل",clear:"مسح السجل",copy:"نسخ",copied:"تمّ النسخ",empty:"ما كاين حتى عملية بعد",err:"عملية غير صالحة",len:"الطول",mass:"الوزن",temp:"الحرارة",close:"إغلاق"},
en:{calc:"Calculator",conv:"Converter",hist:"History",clear:"Clear history",copy:"Copy",copied:"Copied",empty:"No calculations yet",err:"Invalid calculation",len:"Length",mass:"Weight",temp:"Temperature",close:"Close"},
fr:{calc:"Calculatrice",conv:"Convertisseur",hist:"Historique",clear:"Effacer l’historique",copy:"Copier",copied:"Copié",empty:"Aucun calcul",err:"Calcul invalide",len:"Longueur",mass:"Poids",temp:"Température",close:"Fermer"},
es:{calc:"Calculadora",conv:"Conversor",hist:"Historial",clear:"Borrar historial",copy:"Copiar",copied:"Copiado",empty:"Sin cálculos aún",err:"Cálculo no válido",len:"Longitud",mass:"Peso",temp:"Temperatura",close:"Cerrar"}};
const U={len:{m:1,km:1e3,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},mass:{kg:1,g:.001,lb:.45359237,oz:.028349523},temp:{"°C":1,"°F":1,K:1}};
const OPS="+−×÷";
let L=ls.g("novacalc:l");
if(!T[L])L=({ar:"ar",fr:"fr",es:"es"}[(navigator.language||"en").slice(0,2)]||"en");
let expr="",fresh=false,bad=false,last="",res="",cat="len",hist=[];
try{const h=JSON.parse(ls.g("novacalc:h")||"[]");hist=Array.isArray(h)?h.filter(x=>x&&typeof x.e=="string"&&typeof x.r=="string"):[]}catch(e){}

const fmt=v=>{v=parseFloat(v.toPrecision(12));return Math.abs(v)>=1e15||(v!==0&&Math.abs(v)<1e-9)?v.toExponential(6).replace(/\.?0+e/,"e"):v.toLocaleString("en-US",{maximumFractionDigits:10})};
const pretty=s=>s.replace(/([\d)%])([+−×÷])/g,"$1 $2 ").trim();
const raw=v=>String(parseFloat(v.toPrecision(12))).replace("-","−");

function calc(s){
 const t=(s.match(/\d+\.?\d*|\.\d+|[+\-−×÷()%]/g)||[]).map(x=>x=="−"?"-":x);
 while(t.length&&"+-×÷(".includes(t[t.length-1]))t.pop();
 let o=0;t.forEach(x=>{if(x=="(")o++;if(x==")")o--});while(o-->0)t.push(")");
 if(!t.length)throw 0;
 let i=0;const pk=()=>t[i];
 const ex=()=>{let a=tm();while(pk()=="+"||pk()=="-"){const op=t[i++],b=tm();if(b.p)b.v=a.v*b.v;a={v:op=="+"?a.v+b.v:a.v-b.v}}return a};
 const tm=()=>{let a=un();while(pk()=="×"||pk()=="÷"){const op=t[i++],b=un();a={v:op=="×"?a.v*b.v:a.v/b.v}}return a};
 const un=()=>{if(pk()=="-"){i++;const a=un();return{v:-a.v,p:a.p}}return po()};
 const po=()=>{let a=pr();while(pk()=="%"){i++;a={v:a.v/100,p:true}}return a};
 const pr=()=>{const x=t[i++];if(x=="("){const a=ex();if(pk()==")")i++;return{v:a.v}}const n=parseFloat(x);if(isNaN(n))throw 0;return{v:n}};
 const r=ex();if(i<t.length||!isFinite(r.v))throw 0;return r.v;
}

function draw(){
 const big=$("#ex"),sm=$("#pv");let b,s="";
 if(fresh){b=res;s=pretty(last)+" ="}
 else{b=pretty(expr)||"0";
  if(/[+−×÷%(]/.test(expr.slice(1))&&!OPS.includes(expr.slice(-1))){try{s="= "+fmt(calc(expr))}catch(e){}}}
 if(bad)s=T[L].err;
 big.textContent=b;sm.textContent=s;
 big.style.fontSize=Math.max(1.7,3.4-Math.max(0,b.length-7)*.2)+"rem";
}

function ev(){
 if(!expr)return;
 try{const v=calc(expr),r=raw(v);
  hist.unshift({e:expr,r});hist=hist.slice(0,30);ls.s("novacalc:h",JSON.stringify(hist));tape();
  last=expr;res=fmt(v);expr=/e/.test(r)?"":r;fresh=true;
  const q=$(".eq");q.classList.remove("burst");void q.offsetWidth;q.classList.add("burst");
 }catch(e){bad=true}
}

function press(k){
 bad=false;
 if(k=="AC"){expr="";fresh=false}
 else if(k=="⌫"){fresh=false;expr=expr.slice(0,-1)}
 else if(k=="="){ev()}
 else{
  if(fresh&&/[\d.P]/.test(k))expr="";
  fresh=false;
  const c=expr.slice(-1),num=(expr.match(/\d*\.?\d*$/)||[""])[0];
  if(/\d/.test(k)){if(c==")"||c=="%")expr+="×";if(num=="0")expr=expr.slice(0,-1);expr+=k}
  else if(k=="."){if(num.includes("."))return draw();if(c==")"||c=="%")expr+="×";expr+=num?".":"0."}
  else if(k=="P"){
   const o=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
   if(o>0&&/[\d)%.]/.test(c))expr+=")";else{if(/[\d)%.]/.test(c))expr+="×";expr+="("}}
  else if(k=="%"){if(expr&&/[\d)%]/.test(c))expr+="%"}
  else if(k=="−"){if(c=="−")return draw();if(c=="+")expr=expr.slice(0,-1);expr+=k}
  else{
   while(expr&&OPS.includes(expr.slice(-1)))expr=expr.slice(0,-1);
   if(!expr||expr.slice(-1)=="(")return draw();
   expr+=k}
 }
 draw();
}

function tape(){
 const ul=$("#hl");ul.textContent="";
 if(!hist.length){const li=document.createElement("li");li.className="none";li.textContent=T[L].empty;ul.append(li);return}
 hist.forEach(h=>{
  const li=document.createElement("li"),b=document.createElement("button"),s=document.createElement("small"),r=document.createElement("strong");
  s.textContent=pretty(h.e)+" =";r.textContent=fmt(parseFloat(h.r.replace("−","-")));
  b.append(s,r);b.onclick=()=>{expr=h.r;fresh=false;bad=false;box(false);draw()};li.append(b);ul.append(li)});
}
const wide=matchMedia("(min-width:760px)");
function sync(){$("#tape").inert=wide.matches?false:!document.body.classList.contains("open")}
function box(on){document.body.classList.toggle("open",on);sync()}
wide.addEventListener&&wide.addEventListener("change",sync);
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1400)}

function conv(){
 const v=parseFloat($("#cv").value.replace(",","."));
 if(isNaN(v)){$("#co").textContent="—";return}
 const f=$("#cf").value,t=$("#ct").value;let r;
 if(cat=="temp"){const c=f=="°C"?v:f=="°F"?(v-32)*5/9:v-273.15;r=t=="°C"?c:t=="°F"?c*9/5+32:c+273.15}
 else r=v*U[cat][f]/U[cat][t];
 $("#co").textContent=fmt(r);
}
function units(){
 const ks=Object.keys(U[cat]),opt=()=>ks.map(k=>`<option>${k}</option>`).join("");
 $("#cf").innerHTML=opt();$("#ct").innerHTML=opt();$("#ct").selectedIndex=1;conv();
}
function cats(){
 const c=$("#cats");c.textContent="";
 Object.keys(U).forEach(k=>{const b=document.createElement("button");b.className="chip"+(k==cat?" on":"");b.textContent=T[L][k];b.onclick=()=>{cat=k;cats();units()};c.append(b)});
}
function lang(){
 const D=T[L];document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 $$("[data-i]").forEach(e=>e.textContent=D[e.dataset.i]);$("#lang").value=L;cats();tape();draw();
}
function theme(t){document.documentElement.dataset.theme=t;$('meta[name=theme-color]').content=t=="light"?"#EEF1FF":"#0A0D1F"}

$(".pad").onclick=e=>{const b=e.target.closest("button");if(!b)return;navigator.vibrate&&navigator.vibrate(8);press(b.dataset.k)};
$$(".tabs button").forEach(b=>b.onclick=()=>{
 $$(".tabs button").forEach(x=>x.classList.toggle("on",x==b));
 $("#calc").hidden=b.dataset.tab!="calc";$("#conv").hidden=b.dataset.tab!="conv"});
$("#bTape").onclick=()=>box(true);$("#bX").onclick=$("#veil").onclick=()=>box(false);
$("#bClr").onclick=()=>{hist=[];ls.s("novacalc:h","[]");tape()};
$("#bCopy").onclick=()=>{
 let v=fresh?expr:"";
 if(!v){try{v=raw(calc(expr))}catch(e){}}
 if(!v)return;
 (navigator.clipboard?navigator.clipboard.writeText(v.replace("−","-")):Promise.reject()).then(()=>toast(T[L].copied)).catch(()=>{});
};
$("#lang").onchange=e=>{L=e.target.value;ls.s("novacalc:l",L);lang()};
$("#bTheme").onclick=()=>{const t=document.documentElement.dataset.theme=="light"?"dark":"light";ls.s("novacalc:t",t);theme(t)};
$("#cv").oninput=conv;$("#cf").onchange=$("#ct").onchange=conv;
$("#sw").onclick=()=>{const a=$("#cf").value;$("#cf").value=$("#ct").value;$("#ct").value=a;conv()};
addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||$("#calc").hidden||e.target.matches("input,select"))return;
 if(e.target.closest("button")&&(e.key=="Enter"||e.key==" "))return;
 const m={"*":"×","/":"÷","-":"−","Enter":"=","Backspace":"⌫","Escape":"AC","(":"P",")":"P",",":"."};
 const k=m[e.key]||e.key;
 if(/^[\d.+×÷−%=P]$|^(AC|⌫)$/.test(k)){e.preventDefault();press(k)}
});

const st=ls.g("novacalc:t");
theme(st=="light"||st=="dark"?st:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
units();lang();sync();
})();
</script>
</body>
 </html>
